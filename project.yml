name: Fueg0
options:
  bundleIdPrefix: com.azealcompany
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: B8VKLXY4L2
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Fueg0:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Fueg0
        excludes:
          - "**/.DS_Store"
          - "Config/Secrets.plist"
    preBuildScripts:
      - name: Copy Secrets plist
        basedOnDependencyAnalysis: false
        script: |
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DEST"
          SRC="${SRCROOT}/Fueg0/Config/Secrets.plist"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DEST/Secrets.plist"
          fi
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azealcompany.fueg0
        PRODUCT_NAME: Fueg0
        INFOPLIST_FILE: Fueg0/Info.plist
        GENERATE_INFOPLIST_FILE: false
        DEVELOPMENT_TEAM: B8VKLXY4L2
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          ONLY_ACTIVE_ARCH: true
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  Fueg0Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Fueg0Tests
        excludes:
          - LinuxMain.swift
    dependencies:
      - target: Fueg0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azealcompany.fueg0.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: B8VKLXY4L2
        CODE_SIGN_STYLE: Automatic
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: false
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Fueg0.app/Fueg0"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Fueg0:
    build:
      targets:
        Fueg0: all
        Fueg0Tests: [test]
    test:
      config: Debug
      targets:
        - Fueg0Tests
    run:
      config: Debug
      storeKitConfiguration: ../Fueg0.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
